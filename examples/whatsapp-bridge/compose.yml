services:
  whatsapp-bridge:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      WA_LISTEN: "0.0.0.0:8090"
      WA_DATA_DIR: /data
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - type: bind
        source: ${WA_HOST_DATA_DIR:?Set an encrypted data directory}
        target: /data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    init: true
